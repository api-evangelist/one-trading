aid: one-trading
name: One Trading
description: >-
  One Trading (One Trading Exchange B.V.) is an EU-regulated cryptocurrency and
  derivatives exchange for retail and institutional traders, positioning itself
  as "the world's fastest exchange." It offers spot crypto plus crypto futures
  (up to 10x leverage), index futures and 24/7 equity futures. Its public "Fast
  API" provides REST market-data and trading endpoints (currencies, instruments,
  order book, candlesticks, ticker, fees, funding rates, orders, trades, futures
  positions and subaccount transfers) at https://api.onetrading.com/fast, plus a
  real-time WebSocket streams API at wss://streams.fast.onetrading.com. Formerly
  operated as Bitpanda Pro. This profile was surfaced as a Speedinvest portfolio
  company and enriched by the API Evangelist pipeline from the provider's public
  documentation and live endpoints.
